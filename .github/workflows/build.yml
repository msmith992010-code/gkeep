name: Build GKeep APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore signing key
        run: base64 -d app/gkeep-debug.keystore.b64 > app/gkeep-debug.keystore

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GKeep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GKeep-apk
          path: GKeep.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GKeep build ${{ github.run_number }}
          files: GKeep.apk
          make_latest: true
